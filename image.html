<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Vyhledávání obrázků pomocí Google Images.">
    <title>Vyhledávání obrázků</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="search-page">
    <header class="topbar">
      <nav aria-label="Hlavní navigace">
        <a href="index.html">Vyhledávání Google</a>
        <a href="advanced.html">Rozšířené vyhledávání</a>
        <a href="forms.html">Formuláře</a>
      </nav>
    </header>
    <main class="search-main">
      <a class="google-wordmark" href="index.html" aria-label="Google – domů">
        <span class="google-blue">G</span><span class="google-red">o</span><span class="google-yellow">o</span><span class="google-blue">g</span><span class="google-green">l</span><span class="google-red">e</span>
        <span class="image-label">Obrázky</span>
      </a>
      <form class="search-form" action="https://www.google.com/search" method="get" role="search">
        <input type="hidden" name="tbm" value="isch">
        <label class="visually-hidden" for="image-query">Hledat obrázky</label>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
          <input id="image-query" type="search" name="q" autocomplete="off">
        </div>
        <div class="search-actions">
          <button type="submit">Hledat obrázky</button>
        </div>
      </form>
    </main>
    <footer class="site-footer">
      <p class="footer-country">Česká republika</p>
      <div class="footer-links">
        <a href="forms.html">Ukázky formulářů</a>
       <a href="https://martincahel.github.io/">portfolio</a>
        <a href="citace.md">Citace a zdroje</a>
        <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fmartincahel.github.io%2Fgooglesearch%2Fimage.html">Validovat HTML</a>
        <a href="https://jigsaw.w3.org/css-validator/">Validovat CSS</a>
      </div>
    </footer>
  </body>
</html>
